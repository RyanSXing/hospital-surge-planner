name: Verify hospital surge planner
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  CODE_COMMIT: ${{ github.sha }}
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.28
          python-version: 3.12.15
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make setup
      - run: make check
      - run: make audit-dependencies
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make test-e2e
      - name: Retain public test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-evidence
          path: |
            evidence/browser-*.json
            evidence/browser-*.png
          retention-days: 7
          if-no-files-found: ignore
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_APP_ENV: development
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.28
          python-version: 3.12.15
      - run: uv sync --locked
      - run: .venv/bin/python scripts/setup.py
      - run: docker compose --env-file .env -f infra/compose.yaml build
      - run: make containers-up
      - run: docker compose --env-file .env -f infra/compose.yaml up -d --wait --wait-timeout 90 api worker web
      - run: .venv/bin/python scripts/compose_smoke.py
      - name: Container state on failure
        if: failure()
        run: docker compose --env-file .env -f infra/compose.yaml ps
      - name: Stop isolated CI services
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down
      - name: Retain container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-evidence
          path: evidence/compose-smoke.json
          retention-days: 7
          if-no-files-found: ignore
